[package]
name = "catan_mcts_rs"
version = "0.1.0"
edition = "2021"

[lib]
# rlib so `cargo test` can link the crate; cdylib for the PyO3 extension module.
crate-type = ["cdylib", "rlib"]

[dependencies]
catan_engine = { path = "../catan_engine" }
tch = "0.24.0"
pyo3 = { version = "0.22", features = ["extension-module"] }

[dev-dependencies]
